<div id="jobsSection" class="mt-4" style="display: none;">
    <div class="card shadow-lg">
        <div class="card-header border-0 d-flex align-items-center">
            <i class="bi bi-list-task fs-4 me-2"></i>
            <h5 class="mb-0">Emplois Récents</h5>
        </div>
        <div class="card-body">
            <div class="row text-center mb-3">
                <div class="col-md-3">
                    <div class="p-2 border rounded bg-light">
                        <h6 class="mb-0 text-muted">Total</h6>
                        <h4 class="mb-0" id="statTotal">0</h4>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="p-2 border rounded bg-warning text-white">
                        <h6 class="mb-0">Traitement</h6>
                        <h4 class="mb-0" id="statProcessing">0</h4>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="p-2 border rounded bg-success text-white">
                        <h6 class="mb-0">Complétés</h6>
                        <h4 class="mb-0" id="statCompleted">0</h4>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="p-2 border rounded bg-danger text-white">
                        <h6 class="mb-0">Échoués</h6>
                        <h4 class="mb-0" id="statFailed">0</h4>
                    </div>
                </div>
            </div>

            <div class="jobs-container list-group" id="jobsList" style="max-height: 500px; overflow-y: auto;">
                <div class="text-center text-muted p-4">
                    <i class="bi bi-inbox fs-1"></i>
                    <p class="mt-2">Aucun emploi pour le moment.</p>
                </div>
            </div>
        </div>
    </div>
</div>
