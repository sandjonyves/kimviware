<div id="statsSection" class="mt-4" style="display: none;">
    <div class="card shadow-lg">
        <div class="card-header border-0 d-flex align-items-center">
            <i class="bi bi-graph-up fs-4 me-2"></i>
            <h5 class="mb-0">Statistiques Complètes</h5>
        </div>
        <div class="card-body">
            <ul class="nav nav-tabs mb-3" id="statsTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="overview-tab" data-bs-toggle="tab" data-bs-target="#overviewTab" type="button" role="tab" aria-controls="overviewTab" aria-selected="true" onclick="return switchStatsTab('overview')">Vue d'ensemble</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="performance-tab" data-bs-toggle="tab" data-bs-target="#performanceTab" type="button" role="tab" aria-controls="performanceTab" aria-selected="false" onclick="return switchStatsTab('performance')">Performance</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="quality-tab" data-bs-toggle="tab" data-bs-target="#qualityTab" type="button" role="tab" aria-controls="qualityTab" aria-selected="false" onclick="return switchStatsTab('quality')">Qualité</button>
                </li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="overviewTab" role="tabpanel" aria-labelledby="overview-tab">
                    <div class="row g-3 text-center">
                        <div class="col-md-3">
                            <div class="p-3 border rounded bg-info text-white">
                                <h6 class="mb-0">Tests Exécutés</h6>
                                <h4 class="mb-0" id="overviewTotal">0</h4>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="p-3 border rounded bg-success text-white">
                                <h6 class="mb-0">Tests Réussis</h6>
                                <h4 class="mb-0" id="overviewPassed">0</h4>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="p-3 border rounded bg-primary text-white">
                                <h6 class="mb-0">Taux de Réussite</h6>
                                <h4 class="mb-0" id="overviewRate">0%</h4>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="p-3 border rounded bg-secondary text-white">
                                <h6 class="mb-0">Score Mutation</h6>
                                <h4 class="mb-0" id="overviewMutation">--</h4>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="performanceTab" role="tabpanel" aria-labelledby="performance-tab">
                    <p class="text-muted p-4 text-center">
                        Les données de performance seront mises à jour en temps réel...
                    </p>
                </div>

                <div class="tab-pane fade" id="qualityTab" role="tabpanel" aria-labelledby="quality-tab">
                    <p class="text-muted p-4 text-center">
                        Les métriques de qualité seront affichées ici...
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
