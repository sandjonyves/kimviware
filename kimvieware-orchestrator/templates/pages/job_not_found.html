<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emploi introuvable</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, #4c51bf 0%, #5b21b6 45%, #4c1d95 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin: 0;
        }
        .panel {
            text-align: center;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.25);
            padding: 3rem 2.5rem;
            border-radius: 1rem;
            max-width: 28rem;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        p { font-size: 1rem; margin: 1rem 0; opacity: 0.92; line-height: 1.5; }
        a {
            background: #f8fafc;
            color: #4f46e5;
            padding: 0.65rem 1.25rem;
            border-radius: 0.5rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-weight: 500;
            margin-top: 1.25rem;
        }
        a:hover { background: #fff; }
        code { font-size: 0.95em; opacity: 0.95; }
    </style>
</head>
<body>
    <div class="panel">
        <h1><i class="bi bi-search" aria-hidden="true"></i> Emploi introuvable</h1>
        <p>Identifiant : <code>{{ job_id }}</code></p>
        <p>Cet emploi est peut-être encore en cours de traitement ou n’existe pas.</p>
        <p>Réessayez dans un instant ou vérifiez l’identifiant.</p>
        <a href="/"><i class="bi bi-arrow-left" aria-hidden="true"></i> Retour au tableau de bord</a>
    </div>
</body>
</html>
